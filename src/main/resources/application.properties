# ==========================================================
#  Payment Gateway Simulator - configuration
#
#  This file is safe to commit: it has NO passwords.
#  Values like ${DB_URL} are filled in from:
#    - Local:  secrets.properties (next to this file, git-ignored)
#    - Render: Environment Variables in the Render dashboard
# ==========================================================
spring.config.import=optional:classpath:secrets.properties

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" creates the transactions table on first run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Save all dates in UTC, so a laptop in India and a server in the US agree
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=default
spring.data.redis.password=${REDIS_PASSWORD}
# Give up on Redis after 2 seconds, so the MySQL fallback kicks in quickly
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
# We only use Redis as a key-value cache, not for Spring Data repositories
spring.data.redis.repositories.enabled=false

# ---------- App settings ----------
# How long Redis remembers an idempotency key (24 hours)
app.idempotency.ttl-seconds=86400
# Retry a stuck payment at most 3 times: after 2s, 4s, 8s
app.retry.max-attempts=3
app.retry.initial-delay-ms=2000
